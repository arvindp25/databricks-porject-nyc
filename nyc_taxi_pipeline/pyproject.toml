[project]
name = "nyc_taxi_pipeline"
version = "0.0.1"
authors = [{ name = "arvind2512patel@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[project.scripts]
main = "nyc_taxi_pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_taxi_pipeline"]

[tool.ruff]
line-length = 120