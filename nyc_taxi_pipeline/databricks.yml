# This is a Declarative Automation Bundle definition for nyc_taxi_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_taxi_pipeline
  uuid: 7ec60bbf-7e96-407d-9fb2-e5c84e101a79

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f199a65e-0fb6.cloud.databricks.com
    variables:
      catalog: training
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-f199a65e-0fb6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/arvind2512patel@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/arvind2512patel@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: training
      schema: prod
    permissions:
      - user_name: arvind2512patel@gmail.com
        level: CAN_MANAGE
