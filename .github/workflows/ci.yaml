
name: Python CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nyc_taxi_pipeline

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install project
        run: |
          pwd
          ls -la
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Step 4: Run Python linting
      - name: Run Ruff lint
        run: ruff check .

      # Step 5: Check formatting
      - name: Check formatting
        run: ruff format --check .

      # Step 6: Run unit tests
      - name: Run Pytest
        run: pytest tests/ -v
